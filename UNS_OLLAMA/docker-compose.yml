services:
  ollama:
    image: ollama/ollama:latest
    container_name: uns_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - uns_manager_net
    restart: unless-stopped

volumes:
  ollama_data:
    name: uns_ollama_ollama_data

networks:
  uns_manager_net:
    external: true
    name: ${UNS_MANAGER_NETWORK_NAME:-uns_manager_uns_net}
